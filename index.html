<!-- BOXING POMODORO TIMER PANEL -->
  <section id="timerPanel" class="card timer-card">
    <div id="timerPhase" class="phase-badge">READY</div>
    <div id="timerClock" class="timer-display">00:00</div>
    <div id="timerRoundInfo" style="font-size: 0.85rem; color: var(--text-muted);">Round 1 / 1</div>

    <div style="margin-top: 16px; text-align: left;">
      <label style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">EXERCISE NAME</label>
      <input type="text" id="timerExerciseName" placeholder="e.g. Skipping, Heavy Bag, Shadowboxing, Speedbag" style="margin-bottom: 8px;" />

      <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; font-size: 0.75rem;">
        <div>
          <label>PREP (SEC)</label>
          <input type="number" id="prepTime" value="10" />
        </div>
        <div>
          <label>WORK (MIN)</label>
          <input type="number" id="workTime" value="3" step="0.5" />
        </div>
        <div>
          <label>REST (MIN)</label>
          <input type="number" id="restTime" value="1" step="0.5" />
        </div>
        <div>
          <label>ROUNDS</label>
          <input type="number" id="totalRounds" value="3" />
        </div>
      </div>
    </div>

    <div class="timer-controls">
      <button id="startTimerBtn" class="btn">START ROUND</button>
      <button id="pauseTimerBtn" class="btn btn-secondary" disabled>PAUSE</button>
      <button id="resetTimerBtn" class="btn btn-secondary">RESET</button>
    </div>
  </section>
